name: House Price Prediction CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          cache: pip
          cache-dependency-path: requirement.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project dependencies
        run: python -m pip install -r requirement.txt

      - name: Validate Python code
        run: |
          python -m py_compile app.py
          python -m py_compile house.py

      - name: Run unit tests
        continue-on-error: true
        run: |
          mkdir -p test-results
          pytest test_app_50_cases.py \
            -v \
            -ra \
            --junitxml=test-results/junit.xml \
            --html=test-results/unit-test-report.html \
            --self-contained-html

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: test-results/
          if-no-files-found: warn

      - name: Start Flask application
        run: |
          python app.py > flask.log 2>&1 &
          echo $! > flask.pid
          for attempt in {1..10}; do
            if curl --fail --silent http://127.0.0.1:5000/ > /dev/null; then
              echo "Flask application started successfully"
              exit 0
            fi
            sleep 1
          done
          cat flask.log
          exit 1

      - name: Upload Flask log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flask-log
          path: flask.log
          if-no-files-found: ignore