name: House Price Prediction CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  sonarqube:
    name: SonarQube analysis
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: .

      - name: Verify SonarCloud token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN is missing. Add it under repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Run SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >-
            -Dsonar.projectKey=GoneBhavana_House-rent-prediction
            -Dsonar.projectName=House-rent-prediction
            -Dsonar.organization=bhav
            -Dsonar.sources=.
            -Dsonar.exclusions=.git/**,.github/**,static/images/**,model.pkl,test-results/**
            -Dsonar.qualitygate.wait=true

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          cache: pip
          cache-dependency-path: requirement.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project dependencies
        run: python -m pip install -r requirement.txt

      - name: Validate Python code
        run: |
          python -m py_compile app.py
          python -m py_compile house.py

      - name: Run unit tests
        continue-on-error: true
        run: |
          mkdir -p test-results
          pytest test_app_50_cases.py \
            -v \
            -ra \
            --junitxml=test-results/junit.xml \
            --html=test-results/unit-test-report.html \
            --cov=. \
            --cov-report=xml:coverage.xml \
            --self-contained-html

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: test-results/
          if-no-files-found: warn

      - name: Publish coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn

      - name: Start Flask application
        run: |
          python app.py > flask.log 2>&1 &
          echo $! > flask.pid
          for attempt in {1..10}; do
            if curl --fail --silent http://127.0.0.1:5000/ > /dev/null; then
              echo "Flask application started successfully"
              exit 0
            fi
            sleep 1
          done
          cat flask.log
          exit 1

      - name: Upload Flask log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flask-log
          path: flask.log
          if-no-files-found: ignore
  docker-security:
    name: Docker build and Trivy scan
    needs: [test, sonarqube]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag house-rent-prediction:${{ github.sha }} .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: house-rent-prediction:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Smoke test Docker image
        run: |
          docker run --detach --name house-rent-prediction-test \
            --publish 5000:5000 \
            house-rent-prediction:${{ github.sha }}
          trap 'docker rm --force house-rent-prediction-test' EXIT
          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:5000/ > /dev/null; then
              echo "Docker container started successfully"
              exit 0
            fi
            sleep 2
          done
          docker logs house-rent-prediction-test
          exit 1
